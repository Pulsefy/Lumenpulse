services:
  postgres:
    image: postgres:16-alpine
    container_name: lumenpulse-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: lumenpulse
      POSTGRES_PASSWORD: lumenpulse
      POSTGRES_DB: lumenpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-XHELL", "pgs_ready -U lumenpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lumenpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-processing:
    build:
      context: ./apps/data-processing
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - RUN_IMMEDIATELY=true
      - DATABASE_URL=postgres://lumenpulse:lumenpulse@postgres:5432/lumenpulse
      - REDIS_URL=redis://redis:6379
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
