# Staging environment: the images built from main by .github/workflows/staging.yml.
# Runs on the staging host in ~/lumenpulse-staging next to a .env that holds the
# database, Redis and Stellar settings (see docs/STAGING.md).
name: lumenpulse-staging

services:
  backend:
    image: ghcr.io/${IMAGE_OWNER}/lumenpulse-backend:${STAGING_TAG:-staging}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      ENVIRONMENT: staging
      PORT: '3000'
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  webapp:
    image: ghcr.io/${IMAGE_OWNER}/lumenpulse-webapp:${STAGING_TAG:-staging}
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
