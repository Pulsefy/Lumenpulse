[package]
name = "execution-cost-benchmark"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "execution-cost-benchmark"
path = "src/main.rs"

[dependencies]
soroban-sdk = { version = "23", features = ["testutils"] }
test_utils = { path = "../test_utils" }

contributor_registry = { path = "../contributor_registry", features = ["testutils"] }
crowdfund_vault = { path = "../crowdfund_vault", features = ["testutils"] }
feature_flags = { path = "../feature_flags", features = ["testutils"] }
lumen_token = { path = "../lumen_token", features = ["testutils"] }
lumenpulse-community-curation = { path = "../lumenpulse-curation", features = ["testutils"] }
matching_pool = { path = "../matching_pool", features = ["testutils"] }
pricing_adapter = { path = "../pricing_adapter", features = ["testutils"] }
project_registry = { path = "../project_registry", features = ["testutils"] }
protocol_registry = { path = "../protocol_registry", features = ["testutils"] }
treasury = { path = "../treasury", features = ["testutils"] }
upgradable-contract = { path = "../upgradable-contract", features = ["testutils"] }
vesting-wallet = { path = "../vesting-wallet" }
yield-vault = { path = "../yield_vault", features = ["testutils"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
