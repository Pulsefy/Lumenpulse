[package]
name = "pricing_adapter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }
event-versioning = { path = "../event-versioning" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
test_utils = { path = "../test_utils" }

[features]
testutils = ["soroban-sdk/testutils"]
