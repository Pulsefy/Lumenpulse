[package]
name = "cross-contract-view"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Cross-contract view helper library for consistent read patterns"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
default = []
