[package]
name = "treasury"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
reentrancy-guard = { path = "../reentrancy-guard" }
idempotency-guard = { path = "../idempotency-guard" }
event-versioning = { path = "../event-versioning" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.0"

[features]
testutils = ["soroban-sdk/testutils"]
