[workspace]
resolver = "2"
members = [
  "contracts/contributor_registry",
  "contracts/crowdfund_vault",
  "contracts/cross-contract-view",
  "contracts/lumen_token",
  "contracts/matching_pool",
  "contracts/notification_broker",
  "contracts/notification_interface",
  "contracts/project_registry",
  "contracts/protocol_registry",
  "contracts/reentrancy-guard",
  "contracts/upgradable-contract",
  "contracts/version-interface",
  "contracts/event-versioning",
  "contracts/vesting-wallet",
  "contracts/lumenpulse-curation",
  "contracts/pricing_adapter",
  "contracts/treasury",
  "contracts/idempotency-guard",
  "contracts/yield_vault",
  "contracts/feature_flags",
  "contracts/contract_registry",
  "contracts/liquidity_pool",
  "contracts/error-registry"
]
# `contracts/stable_swap_pool` is intentionally not a workspace member: its
# sources still target the pre-v23 Soroban API (`Env::invoker`,
# `storage::Persistent::bump`, `Symbol` as the error type), so it does not
# build against soroban-sdk 23. Its test suite (#1220) is in-tree under
# `contracts/stable_swap_pool/src/test.rs` and will move into CI once the
# contract itself is migrated.
exclude = ["contracts/tests", "contracts/stable_swap_pool"]

[workspace.dependencies]
soroban-sdk = "23"
soroban-sdk-macros = "23"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true