[workspace]
resolver = "2"
members = [
  "contracts/contributor_registry",
  "contracts/crowdfund_vault",
  "contracts/cross-contract-view",
  "contracts/lumen_token",
  "contracts/matching_pool",
  "contracts/notification_interface",
  "contracts/project_registry",
  "contracts/protocol_registry",
  "contracts/reentrancy-guard",
  "contracts/upgradable-contract",
  "contracts/version-interface",
  "contracts/event-versioning",
  "contracts/vesting-wallet",
  "contracts/lumenpulse-curation",
  "contracts/pricing_adapter",
  "contracts/treasury",
  "contracts/idompotency-guard",
  "contracts/yield_vault",
  "contracts/feature_flags",
  "contracts/contract_registry",
  "contracts/error-registry"
]
# Excluded from the workspace:
# - `contracts/tests`: cross-contract integration suite.
# - `contracts/stable_swap_pool`: sources target the pre-v23 Soroban API
#   (`Env::invoker`, `storage::Persistent::bump`, `Symbol` as the error type), so it
#   does not build against soroban-sdk 23. Pending migration.
# - `contracts/test_utils`, `contracts/event-golden`: test/only support crates.
# - `contracts/notification_broker`, `contracts/liquidity_pool`: dead crates with
#   no evident integration (Wave 10 contract inventory consolidation).
# - `contracts/ProtocolStats.sol`: Solidity file in a Soroban project, removed.
exclude = [
  "contracts/tests",
  "contracts/stable_swap_pool",
  "contracts/test_utils",
  "contracts/event-golden",
  "contracts/notification_broker",
  "contracts/liquidity_pool",
]

workspace.dependencies
soroban-sdk = "23"
soroban-sdk-macros = "23"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
