# LumenPulse entity alias registry
# =================================
#
# Single source of truth for mapping the many ways an entity is written in the
# wild ("XLM", "$XLM", "lumens", "Stellar Lumens") onto ONE canonical entity.
#
# Consumed by:
#   * src/analytics/entity_alias_registry.py  (loader + normalization API)
#   * src/analytics/ner_service.py            (entity canonicalization)
#   * src/analytics/keywords.py               (keyword extraction)
#   * src/analytics/onchain_entity_linker.py  (default asset link candidates)
#   * src/db/postgres_service.py              (article entity lookups)
#
# Contributor workflow
# --------------------
# 1. Add or edit an entry below -- no pipeline code changes required.
# 2. Validate:  python scripts/validate_entity_aliases.py
# 3. Open a PR. See ENTITY_ALIAS_REGISTRY.md for the full field reference.
#
# Field reference (short version)
#   canonical_id  required, unique, "<type>:<slug>" -- the stable join key.
#   entity_type   required, one of: asset | project | organization | ecosystem
#   display_name  required, canonical human-readable label.
#   asset_code    optional, ticker/asset code. For entity_type "asset" this is
#                 the surface form used when tagging text (so "lumens" tags as
#                 "XLM", not "Stellar").
#   aliases       optional, every other spelling. Matching is case-insensitive
#                 and ignores a leading "$", so list each spelling once.
#   tags          optional, free-form grouping labels used by analytics filters.
#   notes         optional, why an alias is here (helps future reviewers).
#
# Aliases must be unique across the whole file -- two entities claiming the
# same alias is a validation error, not a silent last-one-wins.

version: 1
updated: "2026-08-29"

