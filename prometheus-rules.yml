# This file defines alerting and recording rules for Prometheus.
# It should be referenced from the main prometheus.yml via the `rule_files` section.

# ------------------------------------------------------------
# Recording Rules (pre‑computed metrics for dashboard efficiency)
# ------------------------------------------------------------
# These rules calculate common aggregates that can be reused in queries.
# They do not generate alerts themselves.

# Example: average HTTP request rate per job over the last 5 minutes
- record: job:http_requests:rate5m
  expr: sum by (job) (rate(http_requests_total[5m]))

# Example: average CPU usage per instance (as a percentage)
- record: instance:cpu_usage:percent
  expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)

# ------------------------------------------------------------
# Alerting Rules
# ------------------------------------------------------------
# Each alert includes a severity label, a human‑readable summary and description,
# and optional annotations for dynamic templating.

- alert: HighCPUUsage
  expr: instance:cpu_usage:percent > 80
  for: 5m
  labels:
    severity: warning
    team: sre
  annotations:
    summary: "High CPU usage on {{ $labels.instance }}"
    description: "CPU usage has been above 80% for more than 5 minutes on instance {{ $labels.instance }} (job: {{ $labels.job }})."

- alert: HighMemoryUsage
  expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
  for: 5m
  labels:
    severity: warning
    team: sre
  annotations:
    summary: "High memory usage on {{ $labels.instance }}"
    description: "Memory usage exceeds 85% for over 5 minutes on {{ $labels.instance }}."

- alert: DiskSpaceLow
  expr: (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"}) / node_filesystem_size_bytes{mountpoint="/"} * 100 > 90
  for: 10m
  labels:
    severity: critical
    team: sre
  annotations:
    summary: "Low disk space on {{ $labels.instance }}"
    description: "Root filesystem usage is above 90% on {{ $labels.instance }}."

- alert: InstanceDown
  expr: up == 0
  for: 2m
  labels:
    severity: critical
    team: sre
  annotations:
    summary: "Instance {{ $labels.instance }} is down"
    description: "No metrics have been received from {{ $labels.instance }} for at least 2 minutes."

- alert: HTTPRequestErrorRate
  expr: sum by (job) (rate(http_requests_total{status=~"5.."}[5m])) / sum by (job) (rate(http_requests_total[5m])) * 100 > 5
  for: 3m
  labels:
    severity: warning
    team: backend
  annotations:
    summary: "High 5xx error rate for {{ $labels.job }}"
    description: "More than 5% of HTTP requests are returning 5xx errors for job {{ $labels.job }} over the last 5 minutes."

# ------------------------------------------------------------
# Grouping
# ------------------------------------------------------------
# All rules are grouped for easier management. Prometheus evaluates each group
# at the interval defined in prometheus.yml (default 1m).

