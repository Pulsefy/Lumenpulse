name: Set up Python app
description: >-
  Python runtime and pip cache for one app in this monorepo. The Python version
  comes from the root `.python-version`, so changing it means editing exactly
  one file. Call it right after `actions/checkout`.

inputs:
  working-directory:
    description: App directory relative to the repository root, e.g. `apps/data-processing`.
    required: true
  cache-dependency-path:
    description: >-
      File(s) feeding the pip cache key. Defaults to
      `<working-directory>/requirements.lock`, the file CI actually installs.
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: ${{ inputs.cache-dependency-path != '' && inputs.cache-dependency-path || format('{0}/requirements.lock', inputs.working-directory) }}
