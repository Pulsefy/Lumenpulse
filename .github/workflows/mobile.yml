name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/mobile/**'
      - 'package*.json'
      - 'pnpm-*.yaml'
      - 'turbo.json'
      - '.nvmrc'
      - '.github/actions/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/mobile/**'
      - 'package*.json'
      - 'pnpm-*.yaml'
      - 'turbo.json'
      - '.nvmrc'
      - '.github/actions/**'
      - '.github/workflows/mobile.yml'

# Issue #1713. See backend.yml for the rationale. Keying on `github.workflow`
# keeps Backend CI, Mobile CI and the flake check in separate queues even when
# they watch the same path, so a mobile push never cancels a backend run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  mobile-checks:
    runs-on: ubuntu-latest
    # Issue #1714. See docs/ci-timeouts.md for the observed-duration table.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start timeout guard
        uses: ./.github/actions/job-timeout-guard
        with:
          phase: start

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-node-app
        with:
          working-directory: apps/mobile

      - name: Type check
        run: npm run tsc -- --noEmit

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Report timeout guard
        if: always()
        uses: ./.github/actions/job-timeout-guard
        with:
          phase: finish
          job-id: mobile-checks
          budget-minutes: '10'
          note: npm ci + tsc --noEmit + jest with coverage. Observed p90 0.8 min.

  # Issue #1413: keep the shipped payload inside a budget. `expo export` output
  # is what the installed app loads, so it is measured on every pull request
  # that touches apps/mobile/**.
  mobile-size:
    runs-on: ubuntu-latest
    # Issue #1714. On a pull request this job exports the payload *twice* -- once
    # for the branch and once for the base branch in a separate worktree -- so it
    # runs at roughly double the cost of a push run. See docs/ci-timeouts.md.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start timeout guard
        uses: ./.github/actions/job-timeout-guard
        with:
          phase: start

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-node-app
        with:
          working-directory: apps/mobile
          # The base branch is installed as well on pull requests, so both
          # lockfiles feed the dependency cache.
          cache-dependency-path: |
            apps/mobile/package-lock.json
            base/apps/mobile/package-lock.json
          root-workspace: 'true'

      - name: Export the app payload
        run: npm run size:export

      # The reported delta is against the base branch, so the base branch is
      # exported the same way. These steps are allowed to fail: if the base
      # branch cannot be built, the check falls back to the recorded baseline
      # rather than blocking the pull request on unrelated infrastructure.
      - name: Checkout the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install base branch dependencies
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: ./base/apps/mobile
        run: npm ci

      - name: Install base branch root workspace dependencies
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: ./base
        run: npm install --no-audit --no-fund

      # Called through `npx` rather than the npm script: the base branch
      # predates the `size:export` script, and may predate the whole check.
      - name: Export the base branch payload
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: ./base/apps/mobile
        run: npx expo export --platform android --platform ios --platform web --output-dir dist

      - name: Check against the size budgets
        id: size
        continue-on-error: true
        run: |
          args=(--report "$RUNNER_TEMP/mobile-size.md")
          if [ -d "$GITHUB_WORKSPACE/base/apps/mobile/dist" ]; then
            args+=(--baseline-root "$GITHUB_WORKSPACE/base/apps/mobile")
          else
            echo "::warning::Base branch export unavailable; reporting against the recorded baseline."
          fi
          node scripts/check-mobile-size.mjs "${args[@]}"

      - name: Add the report to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mobile-size.md" ]; then
            cat "$RUNNER_TEMP/mobile-size.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No size report was produced; see the export step above.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the size report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-size-report
          path: ${{ runner.temp }}/mobile-size.md
          retention-days: 14

      - name: Fail when a budget is exceeded
        if: steps.size.outcome == 'failure'
        run: |
          echo "::error::apps/mobile exceeds its size budget. See the run summary for the per-metric breakdown."
          exit 1

      - name: Report timeout guard
        if: always()
        uses: ./.github/actions/job-timeout-guard
        with:
          phase: finish
          job-id: mobile-size
          budget-minutes: '15'
          note: Two `expo export` runs (branch + base) and a four-way budget comparison.

  # Issue #1576: cold / warm / TTI budget on a throttled low-end web profile.
  mobile-startup:
    runs-on: ubuntu-latest
    # Issue #1714. `playwright install --with-deps` downloads browsers and
    # system packages, so the cold-cache floor is minutes rather than seconds.
    # See docs/ci-timeouts.md.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start timeout guard
        uses: ./.github/actions/job-timeout-guard
        with:
          phase: start

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-node-app
        with:
          working-directory: apps/mobile
          root-workspace: 'true'

      # Issue #1724: the Chromium download (~20 s) is cached by lockfile; the
      # install step below still installs the OS packages and verifies the browser.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Measure startup (low-end profile)
        run: npm run startup:measure
        env:
          CI: '1'

      - name: Check against startup budgets
        id: startup
        continue-on-error: true
        run: npm run startup:check -- --report "$RUNNER_TEMP/mobile-startup.md"

      - name: Add startup report to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mobile-startup.md" ]; then
            cat "$RUNNER_TEMP/mobile-startup.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No startup report was produced; see the measure step above.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload startup report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-startup-report
          path: ${{ runner.temp }}/mobile-startup.md
          retention-days: 14

      - name: Fail when a startup max budget is exceeded
        if: steps.startup.outcome == 'failure'
        run: |
          echo "::error::apps/mobile exceeds its startup time budget. See the run summary."
          exit 1

      - name: Report timeout guard
        if: always()
        uses: ./.github/actions/job-timeout-guard
        with:
          phase: finish
          job-id: mobile-startup
          budget-minutes: '15'
          note: Playwright browser download + Expo web boot + three timed loads on a throttled profile.

  # Issue #1402: end-to-end smoke suite, run headlessly against the Expo web
  # build (the one Expo platform that needs no emulator/simulator in CI).
  mobile-e2e:
    runs-on: ubuntu-latest
    # Issue #1714. Longest job in this workflow by an order of magnitude: the
    # worst observed run took 11.3 min against a 1.4 min median, so the budget is
    # set from the tail, not the median. See docs/ci-timeouts.md.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start timeout guard
        uses: ./.github/actions/job-timeout-guard
        with:
          phase: start

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-node-app
        with:
          working-directory: apps/mobile
          root-workspace: 'true'

      # Issue #1724: the Chromium download (~20 s) is cached by lockfile; the
      # install step below still installs the OS packages and verifies the browser.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Issue #1714: `timeout` fires at 18 min, seven minutes before the job's
      # own 25-minute `timeout-minutes`. Exit 124 is remapped to a titled error
      # so a hung Expo server or a wedged browser is reported as a hang;
      # without this the runner cancels the job and emits nothing, and the seven
      # minute gap is what lets the Playwright report upload on failure.
      - name: Run E2E smoke suite
        env:
          CI: '1'
          MOBILE_E2E_SOFT_LIMIT_SECONDS: '1080'
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s "${MOBILE_E2E_SOFT_LIMIT_SECONDS}" npm run e2e
          code=$?
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo "::error title=mobile-e2e timed out::The smoke suite did not finish within" \
                 "${MOBILE_E2E_SOFT_LIMIT_SECONDS}s and was terminated. The job's 25-minute timeout" \
                 "would have cancelled it in 7 minutes with no output. Check whether" \
                 "\`expo start --web\` finished booting before the suite began polling" \
                 "(see docs/ci-timeouts.md)."
            exit 1
          fi
          exit "$code"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/mobile/playwright-report/
          retention-days: 7

      - name: Report timeout guard
        if: always()
        uses: ./.github/actions/job-timeout-guard
        with:
          phase: finish
          job-id: mobile-e2e
          budget-minutes: '25'
          note: Playwright browser install + `expo start --web` boot + the full smoke suite. Observed p50 1.4 min, worst 11.3 min.