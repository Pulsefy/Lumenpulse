name: Mobile CI

n:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yaml"

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "apps/mobile/package-lock.json"

      - name: Install dependencies
        run: npm install --prefix apps/mobile --no-audit --no-fund

      - name: Typecheck and verify localization keys
        run: cd apps/mobile && npx tsc --noEmit
