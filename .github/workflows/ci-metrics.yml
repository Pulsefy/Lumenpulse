name: CI Metrics

# Weekly measurement of CI run time against the budgets in
# .github/ci-budgets.json (issue #1724). Warns when a budget is exceeded; run
# it manually with `enforce` to make an overrun fail.
on:
  workflow_dispatch:
    inputs:
      enforce:
        description: Fail the run when a budget is exceeded
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  ci-run-time:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Measure CI run time
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENFORCE: ${{ inputs.enforce }}
        run: |
          args=(--json ci-run-time.json --markdown ci-run-time.md)
          if [ "$ENFORCE" = "true" ]; then args+=(--enforce); fi
          node scripts/ci-run-time.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-run-time
          path: |
            ci-run-time.json
            ci-run-time.md
          retention-days: 90
