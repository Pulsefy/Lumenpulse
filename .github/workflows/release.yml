name: Release

# Cuts a tagged release from main on demand (issue #1725): computes the next
# version, builds and hashes the contract WASM, builds and pushes the container
# images, generates the SBOM and changelog, and publishes a GitHub release with
# everything attached. See docs/RELEASING.md for the scheme and how to identify
# a running deployment.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump relative to the latest release tag
        type: choice
        options: [patch, minor, major]
        default: patch
      dry-run:
        description: Build and verify everything but do not push images, tag or publish
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - name: Releases are cut from main
        if: github.ref != 'refs/heads/main' && !inputs.dry-run
        run: |
          echo "::error::Run this workflow from main (selected: ${GITHUB_REF_NAME}). Use dry-run to rehearse from another branch."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Compute the next version
        id: version
        run: node scripts/release/next-version.mjs --bump "${{ inputs.bump }}" | tee -a "$GITHUB_OUTPUT"

      - name: The release commit must have passing CI
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.conclusion == "failure" or .conclusion == "timed_out")] | length')
          total=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" --jq '.total_count')
          echo "check runs on ${GITHUB_SHA}: ${total} total, ${failed} failing"
          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} check run(s) failed on ${GITHUB_SHA}. Fix main before releasing."
            exit 1
          fi

      - name: Generate the changelog
        run: node scripts/release/changelog.mjs --version "${{ steps.version.outputs.version }}" --previous "${{ steps.version.outputs.previous }}" --out changelog.md

      - name: Upload the changelog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: changelog
          path: changelog.md

  contracts:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Same pinned compiler as onchain.yml, so the WASM is byte-identical.
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/onchain

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Build contracts
        working-directory: apps/onchain
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Optimise the WASM (what deploy.ts uploads)
        run: |
          npm ci --prefix scripts
          npm run --prefix scripts wasm:optimize

      - name: Record WASM hashes
        run: |
          node scripts/release/wasm-hashes.mjs \
            apps/onchain/target/wasm32-unknown-unknown/release/optimized \
            --version "${{ needs.prepare.outputs.version }}" \
            --out wasm-hashes.json
          mkdir -p contracts-bundle
          cp apps/onchain/target/wasm32-unknown-unknown/release/optimized/*.wasm contracts-bundle/
          cp wasm-hashes.json contracts-bundle/

      - name: Upload the contract bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contracts
          path: contracts-bundle/

  images:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, webapp, data-processing]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lower-case the registry owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/${{ matrix.app }}
          push: ${{ !inputs.dry-run }}
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/lumenpulse-${{ matrix.app }}:${{ needs.prepare.outputs.version }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Record the image digest
        run: |
          cat > "image-${{ matrix.app }}.json" <<JSON
          {"app":"${{ matrix.app }}","image":"ghcr.io/${{ steps.owner.outputs.owner }}/lumenpulse-${{ matrix.app }}","tag":"${{ needs.prepare.outputs.version }}","digest":"${{ steps.build.outputs.digest }}"}
          JSON

      - name: Upload the image record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.app }}
          path: image-${{ matrix.app }}.json

  sbom:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generate the Software Bill of Materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Upload the SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json

  publish:
    needs: [prepare, contracts, images, sbom]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Download the build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist

      - name: Assemble the release manifest
        run: |
          node scripts/release/manifest.mjs \
            --version "${{ needs.prepare.outputs.version }}" \
            --sha "${GITHUB_SHA}" \
            --images dist/image-backend/image-backend.json dist/image-webapp/image-webapp.json dist/image-data-processing/image-data-processing.json \
            --wasm dist/contracts/wasm-hashes.json \
            --sbom sbom.cdx.json \
            --out release-manifest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.prepare.outputs.version }}" \
            --target "${GITHUB_SHA}" \
            --title "${{ needs.prepare.outputs.version }}" \
            --notes-file dist/changelog/changelog.md \
            release-manifest.json \
            dist/sbom/sbom.cdx.json \
            dist/contracts/wasm-hashes.json \
            dist/contracts/*.wasm
