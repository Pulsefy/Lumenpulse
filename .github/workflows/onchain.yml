name: Onchain CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/onchain/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/onchain/**'
      - 'apps/onchain/.ci-trigger'

jobs:
  onchain-checks:
    name: Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ./apps/onchain

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Read the exact toolchain version from rust-toolchain.toml so that every
    # CI run uses the same compiler as local reproducible builds.  This is the
    # primary mechanism that ensures byte-identical WASM output across machines.
    - name: Read pinned toolchain version
      id: toolchain-version
      run: |
        VERSION=$(grep '^channel' rust-toolchain.toml | sed 's/.*=\s*"\(.*\)"/\1/')
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "Pinned Rust toolchain: ${VERSION}"

    - name: Install pinned Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain-version.outputs.version }}
        targets: wasm32-unknown-unknown
        components: rustc,cargo,rustfmt,clippy,rust-src

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "apps/onchain"

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build Contracts
      run: cargo build --target wasm32-unknown-unknown --release --locked

    # ── Reproducibility gate ──────────────────────────────────────────────
    # Rebuild with the same flags a second time and verify that the SHA-256
    # hashes of the resulting WASM files are identical to the first build.
    # A non-deterministic compiler or build flag would surface here.
    - name: Rebuild contracts (reproducibility check)
      run: |
        # Copy first-build artefacts for comparison
        mkdir -p /tmp/wasm-first
        cp target/wasm32-unknown-unknown/release/*.wasm /tmp/wasm-first/

        # Second independent build
        cargo build --target wasm32-unknown-unknown --release --locked

        echo "=== Comparing first vs second build hashes ==="
        MISMATCH=0
        for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
          name=$(basename "$wasm")
          hash1=$(sha256sum "/tmp/wasm-first/${name}" | awk '{print $1}')
          hash2=$(sha256sum "${wasm}"                  | awk '{print $1}')
          if [ "$hash1" = "$hash2" ]; then
            echo "✅  ${name}  ${hash1}"
          else
            echo "❌  ${name}  MISMATCH"
            echo "    build-1: ${hash1}"
            echo "    build-2: ${hash2}"
            MISMATCH=1
          fi
        done

        if [ "$MISMATCH" -ne 0 ]; then
          echo ""
          echo "ERROR: Builds are not reproducible — byte-identical output required."
          exit 1
        fi

        echo ""
        echo "All contracts produce byte-identical WASM across two independent builds."

    # ── Manifest hash gate ────────────────────────────────────────────────
    # Compare the SHA-256 of every built WASM file against the wasm_hash
    # recorded in testnet-manifest.json.  A mismatch means either the
    # source changed without updating the manifest, or the manifest was
    # updated without a matching source change.
    - name: Verify WASM hashes match testnet-manifest.json
      run: node scripts/verify-hashes.js

    - name: Build base contracts for size comparison
      if: github.event_name == 'pull_request'
      run: |
        git worktree add --detach "$RUNNER_TEMP/lumenpulse-base" "origin/${{ github.base_ref }}"
        cargo build --manifest-path "$RUNNER_TEMP/lumenpulse-base/apps/onchain/Cargo.toml" --target wasm32-unknown-unknown --release

    - name: Report and enforce contract WASM sizes
      env:
        BASELINE_ROOT: ${{ github.event_name == 'pull_request' && format('{0}/lumenpulse-base/apps/onchain/target/wasm32-unknown-unknown/release', runner.temp) || '' }}
      run: |
        baseline_args=()
        if [ -n "$BASELINE_ROOT" ]; then
          baseline_args=(--baseline-root "$BASELINE_ROOT")
        fi
        node ../../scripts/check-wasm-size.mjs "${baseline_args[@]}" | tee wasm-size.md >> "$GITHUB_STEP_SUMMARY"

    - name: Add WASM size report to pull request
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      continue-on-error: true
      with:
        header: wasm-size
        path: apps/onchain/wasm-size.md

    - name: Remove base worktree
      if: always() && github.event_name == 'pull_request'
      run: git worktree remove --force "$RUNNER_TEMP/lumenpulse-base"

    - name: Run tests
      if: env.SKIP_TESTS != 'true'
      run: cargo test
