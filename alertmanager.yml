# alertmanager.yml
# Minimal Alertmanager configuration for Lumenpulse monitoring stack
global:
  resolve_timeout: 5m
route:
  receiver: default
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
receivers:
  - name: default
    # Example webhook; replace with your actual endpoint (Slack, Teams, email, etc.)
    webhook_configs:
      - url: 'http://localhost:5000/alerts'
